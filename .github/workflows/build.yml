name: Build single-file Light/Split

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html' # the bot's own build commits must not retrigger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS syntax check
        run: |
          node --check build/logic.js && echo "logic.js syntax OK"
          node --check build/game.js && echo "game.js syntax OK"

      - name: Run logic tests
        run: node build/test_logic.js

      - name: Build single-file index.html
        run: python3 build/build.py index.html

      - name: Commit built file to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'build index.html [skip ci]'
          git push
